<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="TJU NetPilot 校园网络智能诊断与服务 Agent">
    <title>TJU NetPilot</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css?v=m6">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="TJU NetPilot 首页">
        <span class="brand-mark">NP</span>
        <span>
          <strong>TJU NetPilot</strong>
          <small>校园网络智能诊断与服务 Agent</small>
        </span>
      </a>
      <div class="service-state" id="service-state" role="status" aria-live="polite">
        <span class="state-dot"></span>
        <span class="state-text">正在连接后端…</span>
      </div>
    </header>

    <main class="workspace">
      <section class="chat-panel" aria-labelledby="chat-title">
        <div class="section-heading chat-heading">
          <div>
            <p class="eyebrow">诊断会话</p>
            <h1 id="chat-title">你好，我是 NetPilot</h1>
            <p class="session-label" id="session-label">正在创建安全会话…</p>
          </div>
          <button type="button" class="secondary-button" id="new-session" disabled>
            新建会话
          </button>
        </div>

        <div class="conversation" id="conversation" aria-live="polite" aria-busy="false"></div>

        <div class="quick-prompts" aria-label="测试问题样例">
          <span>快速测试</span>
          <button type="button" data-prompt="我可以访问公网 IP，但打不开 github.com，请自动诊断。">DNS 故障</button>
          <button type="button" data-prompt="天津大学 VPN 怎么使用？请检索知识库并标出来源。">VPN 使用</button>
          <button type="button" data-prompt="github.com 可以 ping 通，但 SSH 连接不上，请检查 22 端口。">SSH 端口</button>
          <button type="button" data-prompt="请检查当前网络是否存在明显异常。">健康检查</button>
        </div>

        <form class="composer" id="chat-form">
          <label class="sr-only" for="message-input">描述你的网络问题</label>
          <textarea
            id="message-input"
            rows="3"
            maxlength="4000"
            placeholder="例如：我连上 Wi-Fi 了，但是网页打不开"
            disabled
          ></textarea>
          <button type="submit" id="send-button" disabled>开始诊断</button>
        </form>
        <p class="interaction-note" id="interaction-note" role="status" aria-live="polite">
          正在初始化服务状态…
        </p>
      </section>

      <aside class="diagnostics-panel" aria-label="诊断状态">
        <section class="status-card">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">运行状态</p>
              <h2>服务概览</h2>
            </div>
            <span class="mode-badge" id="tool-mode">--</span>
          </div>
          <dl class="health-grid">
            <div><dt>后端 API</dt><dd id="api-status">检查中</dd></div>
            <div><dt>TJU LLM</dt><dd id="llm-status">检查中</dd></div>
            <div><dt>知识库</dt><dd id="rag-status">检查中</dd></div>
          </dl>
          <div class="scenario-control" id="scenario-control" hidden>
            <label for="scenario-select">Mock 故障场景</label>
            <select id="scenario-select" disabled></select>
            <p id="scenario-description">加载场景中…</p>
          </div>
        </section>

        <section class="status-card diagnosis-card" id="diagnosis-card">
          <div class="section-heading compact">
            <div>
              <p class="eyebrow">当前诊断</p>
              <h2>诊断结论</h2>
            </div>
            <span class="diagnosis-badge idle" id="diagnosis-status">等待</span>
          </div>
          <p class="diagnosis-summary" id="diagnosis-summary">提交问题后显示本次诊断结论与证据数量。</p>
        </section>

        <section class="status-card">
          <p class="eyebrow">工具执行步骤</p>
          <h2>诊断时间线</h2>
          <div id="tool-timeline">
            <div class="empty-state"><span>01</span><p>开始诊断后，此处将展示每一步只读检测及其证据。</p></div>
          </div>
        </section>

        <section class="status-card">
          <p class="eyebrow">参考知识</p>
          <h2>校园网络来源</h2>
          <div id="source-list">
            <div class="empty-state"><span>KB</span><p>使用知识库后，此处将展示标题、资料类型和原始链接。</p></div>
          </div>
        </section>
      </aside>
    </main>

    <script src="/app.js?v=m6" defer></script>
  </body>
</html>
